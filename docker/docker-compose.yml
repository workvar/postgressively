# cp .env.example .env, edit it, then: docker compose up -d --build
#
# Runs Postgres, agent, backend, and web together. The agent can't control
# this Postgres instance's service (start/stop/restart) the way it can a
# bare-metal install -- there's no systemd/brew/pg_ctl to reach from inside
# a container -- so AGENT_ALLOW_SERVICE_CONTROL is off here. Browsing,
# querying, and row editing all work normally.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    image: ghcr.io/workvar/postggresively-agent:${POSTGGRESSIVELY_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - agent-backups:/var/backups/postggresively
      # Optional: uncomment to allow in-app Docker updates from the console.
      # - /var/run/docker.sock:/var/run/docker.sock
      - .:/compose:ro
    environment:
      AGENT_ADDR: 0.0.0.0:8081
      AGENT_TOKEN: ${AGENT_TOKEN}
      AGENT_PG_SERVICE: postgresql
      AGENT_SERVICE_MANAGER: auto
      AGENT_BACKUP_DIR: /var/backups/postggresively
      AGENT_PG_BIN_DIR: ""
      AGENT_PG_DATA_DIR: ""
      AGENT_PG_HOST: postgres
      AGENT_PG_PORT: 5432
      AGENT_PG_USER: ${POSTGRES_USER:-postgres}
      AGENT_PG_LOG_FILE: ""
      AGENT_ALLOW_SERVICE_CONTROL: "false"
      AGENT_INSTALL_KIND: docker
      AGENT_INSTALL_ROOT: /compose

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    image: ghcr.io/workvar/postggresively-backend:${POSTGGRESSIVELY_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      PG_ADDR: :8080
      PG_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-postgres}
      PG_META_DATABASE: postggresively
      PG_JWT_SECRET: ${JWT_SECRET}
      PG_SECRET_KEY: ""
      PG_AGENT_URL: http://agent:8081
      PG_AGENT_TOKEN: ${AGENT_TOKEN}
      PG_CORS_ORIGIN: ${PUBLIC_URL:-http://localhost:3000}
      PG_READ_ONLY: "false"
      PG_MAX_ROWS: "500"
      PG_QUERY_TIMEOUT_SECONDS: "30"
      PG_WEBAUTHN_RPID: ${WEBAUTHN_RPID:-localhost}
      PG_WEBAUTHN_NAME: Postggresively
      PG_WEBAUTHN_ORIGINS: ${PUBLIC_URL:-http://localhost:3000}
      PG_DATA_DIR: /data
      PG_INSTALL_KIND: docker
      PG_INSTALL_ROOT: /compose
    volumes:
      - backend-data:/data
    # Anonymous product analytics (GA4 Measurement Protocol) has no env var
    # or .env entry here on purpose: the credentials are baked into the
    # image at build time via ldflags (see docker/Dockerfile.backend), not
    # read from the environment. A plain `docker compose up -d --build`
    # here leaves analytics fully local; only the published
    # ghcr.io/.../postggresively-backend image (built by
    # .github/workflows/release.yml from a GitHub Actions repository
    # variable and secret) has real credentials. See docker/README.md.

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8080}
        # UI analytics (Microsoft Clarity) is the same story as the
        # backend's GA4 credentials above: baked in only by the official CI
        # build (docker/README.md), never read from docker/.env here.
    image: ghcr.io/workvar/postggresively-web:${POSTGGRESSIVELY_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  postgres-data:
  agent-backups:
  backend-data:
